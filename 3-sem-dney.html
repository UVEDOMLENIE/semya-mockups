<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«СемьЯ» — семь дней вслепую</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --bg: #0E0E0E; --card: #1B1B1B; --ink: #F5F5F0; --muted: #9A9A92; --line: #333; --accent: #E8FF3A; --on-accent: #0E0E0E;
          --good: #2A3300; --warn: #2B2B22; --r: 6px; --font: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --head: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { padding-bottom: 130px; }
  h1, h2 { font-weight: 900; letter-spacing: -.5px; }
  .hero h1 { font-size: 54px; line-height: .95; margin: 10px 0 18px; }
  .tag { display: inline-block; background: var(--accent); color: var(--on-accent); font-weight: 800; padding: 3px 10px; margin: 14px 0 0; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
  .lead { font-size: 18px; color: #D8D8D0; }
  .no-list { list-style: none; padding: 0; margin: 18px 0; font-size: 22px; font-weight: 800; } .no-list li { border-top: 1px solid var(--line); padding: 8px 0; }
  .slogan { font-size: 22px; font-weight: 900; color: var(--accent); margin: 26px 0 4px; }
  .small { font-size: 13px; color: var(--muted); }
  blockquote { border-left: 4px solid var(--accent); margin: 14px 0; padding: 4px 12px; font-size: 18px; font-style: italic; }
  .btn { border-radius: var(--r); text-transform: none; }
  .btn.ghost { color: var(--ink); border-color: var(--ink); }
  .field input { background: var(--card); color: var(--ink); border-color: var(--line); }
  .seg button { background: var(--card); color: var(--ink); border-color: var(--line); }
  .chips2 { display: flex; flex-wrap: wrap; gap: 8px; } .chips2.col { flex-direction: column; }
  .chips2 button { padding: 10px 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: var(--r); text-align: left; font-size: 15px; }
  .chips2 button.sel, .seg button.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .top span { color: var(--accent); font-weight: 800; }
  .days { display: flex; gap: 6px; margin: 12px 0 18px; } .days i { flex: 1; height: 30px; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; background: var(--card); color: var(--muted); border-radius: 4px; font-size: 14px; }
  .days i.past { background: #3A3A3A; color: var(--ink); } .days i.yes { background: var(--accent); color: var(--on-accent); } .days i.now { outline: 2px solid var(--accent); color: var(--ink); }
  .pre { color: var(--accent); font-weight: 800; }
  .sit { font-size: 28px; line-height: 1.12; margin: 6px 0 18px; }
  .opt { display: block; width: 100%; text-align: left; padding: 16px; margin: 0 0 10px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--r); font-size: 17px; }
  .opt:active { border-color: var(--accent); }
  .mine, .his { background: var(--card); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; font-weight: 700; }
  .mine small, .his small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; margin-bottom: 4px; }
  .his { border-left: 4px solid var(--accent); } .his em { display: block; font-weight: 400; color: #D8D8D0; margin-top: 6px; }
  .wait { color: var(--muted); }
  .ask { font-size: 20px; font-weight: 800; margin: 16px 0 8px; }
  .votes { display: flex; gap: 10px; } .votes button { flex: 1; font-size: 32px; padding: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); }
  .score { color: var(--accent); font-weight: 800; }
  .big { font-size: 72px; margin: 10px 0; color: var(--accent); }
  .face { display: flex; gap: 14px; align-items: center; background: var(--card); padding: 14px; border-radius: var(--r); margin: 14px 0; }
  .face h2 { margin: 0; } .face p { margin: 4px 0 0; color: #D8D8D0; }
  .photo { flex: 0 0 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; }
  .two { display: flex; gap: 8px; } .two .btn { margin: 6px 0; }
  .plate { background: var(--card); border-left: 4px solid var(--accent); padding: 12px 14px; margin: 12px 0; border-radius: var(--r); }
  .drow { margin-bottom: 14px; } .drow .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; } .drow .mine, .drow .his { font-size: 14px; margin: 0; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #000; border-top: 1px solid var(--line); z-index: 40; padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { flex: 1; border: 0; background: none; padding: 14px 4px; color: var(--muted); font-size: 15px; font-weight: 700; } .tabs button.on { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
  .bug { bottom: 70px; background: var(--accent); color: var(--on-accent); }
  @media (prefers-reduced-motion: no-preference) { .pulse { animation: blink 1s ease-in-out infinite alternate; } @keyframes blink { to { opacity: .35; } } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="people.js"></script>
<script src="notes.js"></script>
<script src="v3.js"></script>
</body>
</html>
