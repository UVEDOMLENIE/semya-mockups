<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«СемьЯ» — ваша версия</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --bg: #F7F3EA; --card: #FFFFFF; --ink: #1F2A44; --muted: #6B7084; --line: #D9D3C4; --accent: #23407A; --on-accent: #FFFFFF;
          --good: #E8F0E3; --warn: #FBF0DA; --r: 10px; --font: Georgia, "Times New Roman", serif; --head: Georgia, "Times New Roman", serif; }
  .top { text-align: center; padding: 18px 0 6px; border-bottom: 3px double var(--accent); margin-bottom: 16px; }
  .logo { font-size: 40px; color: var(--accent); margin: 0; letter-spacing: 1px; } .logo b { color: #A23B3B; }
  .motto { font-style: italic; margin: 4px 0 0; color: var(--muted); }
  .doc { background: var(--card); border: 1px solid var(--line); padding: 16px; border-radius: 4px; box-shadow: 0 2px 0 var(--line); margin-bottom: 12px; }
  .doc h2, .h { color: var(--accent); font-size: 22px; margin: 0 0 10px; } .h { margin-top: 8px; }
  .doc h3 { color: var(--accent); margin: 18px 0 6px; font-size: 18px; } .center { text-align: center; color: var(--accent); }
  .stamp { display: inline-block; border: 2px solid #A23B3B; color: #A23B3B; padding: 2px 8px; transform: rotate(-3deg); font-size: 13px; margin-bottom: 10px; }
  .imp { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 6px; } .imp small { display: block; font-size: 12px; }
  .imp.big { font-size: 16px; color: var(--ink); margin: 10px 0; }
  .field select { margin-bottom: 6px; } .field textarea { width: 100%; font: inherit; padding: 10px; border: 1.5px solid var(--line); border-radius: 7px; margin-top: 6px; }
  .hide { display: none; }
  .bmi { margin: 6px 0 0; font-size: 15px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 15px; }
  .photos { display: flex; gap: 10px; margin: 6px 0 12px; } .phbox { flex: 1; border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px 8px; text-align: center; color: var(--muted); font-size: 15px; }
  .phbox.ini { font-size: 34px; color: var(--accent); } .phbox small { font-size: 12px; }
  .test { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 12px 0; border: 0; border-bottom: 1px dashed var(--line); background: none; color: var(--ink); }
  .test small { color: var(--muted); display: block; font-size: 14px; } .st { font-size: 14px; white-space: nowrap; } .st.go { color: var(--accent); font-weight: 700; } .st.ok { color: #4F8A3F; }
  .res { margin: 4px 0 6px; font-size: 14px; color: #4F8A3F; } .prog { font-weight: 700; color: var(--accent); }
  .scale { display: flex; gap: 6px; } .scale .q-opt { text-align: center; padding: 14px 0; }
  .sv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #EEE8DA; font-size: 15px; } .sv span { color: var(--muted); } .sv b { text-align: right; font-weight: 400; }
  .legend { font-size: 12px; margin: 2px 0 0; } .zod { background: var(--warn); padding: 10px 12px; border-radius: 6px; }
  .counts { display: flex; gap: 6px; } .counts button { flex: 1; padding: 12px 0; border: 1.5px solid var(--line); background: var(--card); border-radius: 7px; font-size: 18px; }
  .counts button.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .plan { display: flex; justify-content: space-between; align-items: center; border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; background: var(--card); }
  .plan.best { border-color: var(--accent); } .plan span { color: var(--muted); font-size: 14px; }
  .btn[disabled] { opacity: .45; }
  /* карточка — по её образцу №4 */
  .kcard { background: #FFFDF7; border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin: 0 0 18px; box-shadow: 0 10px 22px rgba(35,64,122,.10); position: relative; }
  .kcard.prev { border-style: dashed; }
  .k-num { font-family: "Courier New", monospace; font-size: 13px; color: var(--muted); letter-spacing: 2px; }
  .k-head { display: flex; align-items: center; gap: 12px; margin: 8px 0; } .k-head h3 { margin: 0; font-size: 26px; color: var(--accent); }
  .k-photo { flex: 0 0 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #DCE4F2, #F3E5D6); box-shadow: 0 0 0 2px var(--accent); display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--accent); }
  .k-phrase { font-size: 15px; margin: 6px 0; } .k-phrase b { color: #A23B3B; font-size: 20px; }
  .k-axes { font-size: 13px; color: var(--muted); margin: 0 0 10px; } .k-axes small { font-size: 12px; }
  .k-quote { font-style: italic; font-size: 18px; color: #A23B3B; border-top: 1px solid #EEE8DA; border-bottom: 1px solid #EEE8DA; padding: 8px 0; margin-bottom: 8px; }
  .k-quote small { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
  details summary { color: var(--accent); font-weight: 700; padding: 8px 0; cursor: pointer; }
  .ok { color: #4F8A3F; } .doc.ok { background: var(--good); }
  .inbox { display: block; width: 100%; padding: 14px; margin: 6px 0 12px; border: 2px solid #A23B3B; color: #A23B3B; background: #fff; border-radius: var(--r); font-size: 17px; font-weight: 700; }
  .msg { font-size: 17px; } .two { display: flex; gap: 8px; } .two .btn { margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><p class="logo">Семь<b>Я</b></p><p class="motto">Мы не для свиданий. Мы для создания семьи.</p></div>
  <div id="app"></div>
</div>
<script src="people.js"></script>
<script src="notes.js"></script>
<script src="v1.js"></script>
</body>
</html>
